# SonarQube Cloud, analysé par le job `sonar` de .github/workflows/ci.yml.
# L'analyse automatique de SonarQube Cloud ne reçoit pas de rapport de
# couverture : la laisser désactivée (Administration > Analysis Method), les
# deux méthodes sont en conflit.
sonar.organization=muchiny
sonar.projectKey=muchiny_cockpit-mods
sonar.projectName=cockpit-mods
sonar.sourceEncoding=UTF-8

# Périmètre. Code analysé : les modules de hooks des deux mods, leurs contrats
# d'état (types/), les scripts des bancs qualité et les workflows (règles
# GitHub Actions). Hors périmètre : les types du moteur
# (.claude-plugin/types/, écrits par Claude Code et absents du dépôt).
sonar.sources=status-band/hooks,status-band/types,plan-de-vol/hooks,plan-de-vol/types,qa,.github
sonar.tests=status-band/hooks/status-band.test.tsx,plan-de-vol/tests
# Un fichier est du code ou du test, jamais les deux : la suite de status-band
# vit dans hooks/, à côté du module. Les rapports et copies de travail des
# bancs n'existent qu'après une mesure locale.
sonar.exclusions=status-band/hooks/status-band.test.tsx,**/node_modules/**,qa/status-band/.coverage/**,qa/status-band/.mutation/**,qa/plan-de-vol/coverage/**,qa/plan-de-vol/mutation/**
# Les dessins approuvés sont des données générées par qa/plan-de-vol/golden.mjs.
sonar.test.exclusions=plan-de-vol/tests/golden.ts

# Couverture : les deux lcov.info viennent du job `qa` (coverage.mjs de chaque
# banc, Istanbul mesuré dans le moteur), aux chemins comptés depuis la racine
# du dépôt. Les scripts des bancs et les workflows n'ont pas de rapport : sans
# cette exclusion ils compteraient 0 % et feraient échouer la porte qualité.
sonar.javascript.lcov.reportPaths=qa/status-band/.coverage/report/lcov.info,qa/plan-de-vol/coverage/lcov.info
sonar.coverage.exclusions=qa/**,.github/**
