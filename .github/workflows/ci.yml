name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Le moteur qui valide les mods et joue leurs tests. Son API de mods est en
  # accès anticipé et peut changer d'une version à l'autre : version fixée, à
  # relever avec celle qui tourne en local (les types du moteur ne sont posés
  # que par une session, `tsc` et ESLint restent donc des portes locales).
  CLAUDE_CODE_VERSION: "2.1.325"

jobs:
  # Validation, tests, dessins approuvés et couverture des deux mods. Ni
  # `claude plugin validate` ni `claude plugin test` ne demandent de compte.
  qa:
    name: Tests et couverture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Dépendances des bancs
        working-directory: qa
        run: npm ci
      - name: Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validation (marketplace et mods)
        run: |
          claude plugin validate .
          claude plugin validate status-band
          claude plugin validate plan-de-vol
      - name: Tests
        run: |
          claude plugin test status-band
          claude plugin test plan-de-vol
      - name: Dessins approuvés (plan-de-vol)
        working-directory: qa/plan-de-vol
        run: node golden.mjs --check
      - name: Couverture status-band (100 %)
        run: node qa/status-band/coverage.mjs --strict
      - name: Couverture plan-de-vol (100 %)
        working-directory: qa/plan-de-vol
        run: node coverage.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          # La racine de l'artefact est l'ancêtre commun des deux chemins, qa/.
          path: |
            qa/status-band/.coverage/report/lcov.info
            qa/plan-de-vol/coverage/lcov.info
          # Le rapport de status-band est sous un dossier caché (.coverage).
          include-hidden-files: true
          if-no-files-found: error

  # Analyse SonarQube Cloud : les sources, avec les deux rapports lcov du job
  # `qa` ; réglages dans sonar-project.properties. Ce job n'installe ni ne
  # lance aucun code du dépôt. Dependabot et les PR de forks ne reçoivent pas
  # SONAR_TOKEN : le job est sauté pour eux.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    needs: qa
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : Sonar lit le blame pour distinguer le code neuf.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: qa
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
